<app-navbar></app-navbar>

<div id="newTaskForm" class="container mx-auto px-4 py-8 max-w-md md:max-w-lg lg:max-w-xl xl:max-w-6xl">
  <div class="container mx-auto px-4 py-8 max-w-md md:max-w-lg lg:max-w-xl xl:max-w-6xl">
    <div class="bg-white rounded-xl card-shadow border-0">
      <div class="grid grid-cols-2 gap-4 w-full">
        <div class="p-6 space-y-6">
          <div id="taskForm" class="space-y-4">
            <div class="">
              <div class="space-y-2">
                <h1 class="text-2xl font-bold mb-2">{{task?.title}}</h1>
              </div>
              <div class="space-y-2">
                <label class="text-sm font-medium text-gray-700" for="descriptionTask">{{task?.descriptionTask}}</label>
              </div>
              <div class="space-y-2">
                <label class="text-sm font-medium text-gray-700" for="dueDate">{{task?.dateDue}}</label>
              </div>
              <div class="space-y-2">
                <label class="text-sm font-medium text-gray-700" for="status">{{task?.statusTask}}</label>
              </div>
              <div class="flex gap-3 mt-4">
                <button [class]="currentStatus === 'pending' ? 
      'px-4 py-2 rounded-lg bg-yellow-400 text-white font-medium' : 
      'px-4 py-2 rounded-lg bg-gray-100 text-gray-600 font-medium hover:bg-gray-200'"
                  (click)="onStatusClick('pending')">
                  Pendiente
                </button>

                <button [class]="currentStatus === 'in_progress' ? 
      'px-4 py-2 rounded-lg bg-blue-500 text-white font-medium' : 
      'px-4 py-2 rounded-lg bg-gray-100 text-gray-600 font-medium hover:bg-gray-200'"
                  (click)="onStatusClick('in_progress')">
                  En proceso
                </button>

                <button [class]="currentStatus === 'completed' ? 
      'px-4 py-2 rounded-lg bg-green-500 text-white font-medium' : 
      'px-4 py-2 rounded-lg bg-gray-100 text-gray-600 font-medium hover:bg-gray-200'"
                  (click)="onStatusClick('completed')">
                  Completada
                </button>
              </div>
            </div>

            <button type="submit" class="btn-primary w-full h-12 text-white font-medium rounded-lg">
              <span class="flex items-center justify-center">
              </span>
              <span>jjjj</span>
            </button>
          </div>
        </div>
        <div class="bg-white rounded-2xl shadow border p-6 mt-6">

          <h3 class="text-2xl font-semibold text-gray-800 mb-6">
            Comentarios de la entrega
          </h3>

          <!-- Lista de comentarios -->
          <div class="space-y-4 mb-6">

            <div *ngFor="let comment of comments" class="border border-gray-200 rounded-xl p-4 bg-gray-50">

              <!-- Usuario -->
              <div class="mb-2">
                <span class="font-semibold text-gray-700">
                  Usuario #{{ comment.userComment }}
                </span>
              </div>

              <!-- Vista normal -->
              <div *ngIf="editingCommentId !== comment.id" class="flex justify-between items-start gap-3">

                <p class="text-gray-700 break-words flex-1">
                  {{ comment.commentText }}
                </p>

                <button class="text-gray-500 hover:text-blue-600 text-lg" (click)="startEdit(comment)">
                  ⋮
                </button>

              </div>

              <!-- Editando -->
              <div *ngIf="editingCommentId === comment.id">

                <textarea [(ngModel)]="editedText" class="w-full border border-gray-300 rounded-lg p-3 mb-3">
      </textarea>

                <div class="flex gap-2">

                  <button class="px-4 py-2 bg-green-600 text-white rounded-lg" (click)="saveEdit(comment)">
                    Guardar
                  </button>

                  <button class="px-4 py-2 bg-gray-600 text-white rounded-lg" (click)="cancelEdit()">
                    Cancelar
                  </button>

                </div>

              </div>

              <!-- Fecha -->
              <div class="mt-3">
                <span class="text-sm text-gray-500">
                  {{ comment.submitedAt }}
                </span>
              </div>

            </div>

          </div>
          <div class="space-y-4">

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">
                Comentario
              </label>

              <textarea [(ngModel)]="commentText" class="w-full border border-gray-300 rounded-xl px-4 py-3
               focus:ring-2 focus:ring-blue-500 focus:border-blue-500
               outline-none transition resize-none" placeholder="Deja un comentario..." rows="4">
      </textarea>
            </div>

            <!-- Botones -->
            <div class="flex justify-end gap-3">

              <button (click)="cancelComment()" class="px-5 py-2 border border-gray-300 rounded-xl
               text-gray-700 hover:bg-gray-100 transition">
                Cancelar
              </button>

              <button (click)="newComment()" class="px-5 py-2 bg-blue-600 text-white rounded-xl
               hover:bg-blue-700 transition shadow">
                Enviar comentario
              </button>

            </div>

          </div>
        </div>
      </div>


    </div>

  </div>
</div>
