<!--Este código HTML define la estructura de una barra de navegación para una aplicación web.-->
<nav>
  <div class="hidden md:flex desktop-header fixed left-0 top-0 w-64 h-screen z-50 card-shadow border-0 felx-col">
    <div class="container mx-auto px-6 py-4">
      <div class="flex flex-col h-full">
        <div class="flex items-center space-x-6">
          <div class="p-6">
            <nav class="flex flex-col space-y-4 mt-6">
              <a [routerLink]="['/Home']" routerLinkActive="text-blue-600 font-semibold"
                [routerLinkActiveOptions]="{exact: true}"
                class="text-gray-600 hover:text-blue-600 font-medium transition-colors">Inicio</a>
              <!-- <a [routerLink]="['/']" routerLinkActive="text-blue-600 font-semibold" class="text-gray-600 hover:text-blue-600 font-medium transition-colors">Nada</a> -->

              <ng-container *ngIf="isLoggedIn">
                <a *ngIf="userRole === 1 || userRole === 2" [routerLink]="['/AltaUsuario']"
                  routerLinkActive="text-blue-600 font-semibold"
                  class="text-gray-600 hover:text-blue-600 font-medium transition-colors">Alta de usuarios</a>
                <a *ngIf="userRole === 1 || userRole === 2" [routerLink]="['/BajaUsuario']"
                  routerLinkActive="text-blue-600 font-semibold"
                  class="text-gray-600 hover:text-blue-600 font-medium transition-colors">Baja de usuarios</a>
                <a *ngIf="userRole === 1 || userRole === 2" [routerLink]="['/ModificarUsuario']"
                  routerLinkActive="text-blue-600 font-semibold"
                  class="text-gray-600 hover:text-blue-600 font-medium transition-colors">Modificar usuarios</a>
              </ng-container>

              <!-- <a [routerLink]="['/view']" routerLinkActive="text-blue-600 font-semibold" class="text-gray-600 hover:text-blue-600 font-medium transition-colors">Cotizacionar</a> -->
            </nav>
          </div>
        </div>
        <div class="mt-auto p-6">
          <div class="mt-auto flex flex items-center space-x-4 relative pb-6">
          <a *ngIf="!isLoggedIn" href="/login" class="btn-primary px-4 py-2 rounded-lg text-white text-sm font-medium">
            Iniciar Sesión
          </a>
          <div *ngIf="isLoggedIn" class="relative">
            <button (click)="toggleProfileMenu()"
              class="btn-ghost p-2 rounded-lg flex items-center space-x-2 hover:bg-gray-100 transition-colors">
              <div class="w-8 h-8 rounded-full bg-gray-300 flex items-center justify-center">
                <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
              </div>
              <span class="text-sm font-medium">{{userName}}</span>
              <svg class="w-4 h-4 transition-transform" [class.rotate-180]="showProfileMenu" fill="none"
                stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
              </svg>
            </button>
            <div *ngIf="showProfileMenu"
              class="absolute right-0 mt-2 w-48 bg-white border border-gray-200 rounded-lg shadow-lg z-50"
              (click)="closeProfileMenu()">
              <div class="px-4 py-3 border-b border-gray-200">
                <div class="flex items-center space-x-3">
                  <div>
                    <p *ngIf="userInfo?.userId" class="text-xs text-gray-500">ID de usuario{{ userInfo?.userId }}</p>
                    <p class="text-sm font-medium text-gray-900">Nombre:{{ userName }}</p>
                    <p class="text-xs text-gray-500">Tipo de permisos:{{ userInfo?.role }}</p>
                  </div>
                </div>
              </div>
              <div class="py-1">
                <a *ngIf="userInfo" [routerLink]="['/userProfile', userInfo.userId]"
                  class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 transition-colors">
                  <svg class="w-4 h-4 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                  </svg>
                  Mi Perfil
                </a>
                <a href="/configuracion"
                  class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 transition-colors">
                  <svg class="w-4 h-4 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  </svg>
                  Configuración
                </a>
                <hr class="my-1 border-gray-200">
                <button (click)="logout()"
                  class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50 transition-colors">
                  <svg class="w-4 h-4 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                  </svg>
                  Cerrar sesión
                </button>
              </div>
            </div>
          </div>
        </div>
        </div>
      </div>
    </div>
  </div>
</nav>
<div *ngIf="showProfileMenu" class="fixed inset-0 z-40" (click)="closeProfileMenu()">
</div>
